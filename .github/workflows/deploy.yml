name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare password hashes
        env:
          EMERGENCY_POPUP_PASSWORDS: ${{ vars.EMERGENCY_POPUP_PASSWORDS || secrets.EMERGENCY_POPUP_PASSWORDS }}
          VITE_EMERGENCY_POPUP_PASSWORD_HASHES: ${{ vars.VITE_EMERGENCY_POPUP_PASSWORD_HASHES || secrets.VITE_EMERGENCY_POPUP_PASSWORD_HASHES }}
          VITE_EMERGENCY_POPUP_PASSWORD_HASH: ${{ vars.VITE_EMERGENCY_POPUP_PASSWORD_HASH || secrets.VITE_EMERGENCY_POPUP_PASSWORD_HASH }}
          ALLY_PASSWORDS: ${{ vars.ALLY_PASSWORDS || secrets.ALLY_PASSWORDS }}
          VITE_ALLY_PASSWORD_HASHES: ${{ vars.VITE_ALLY_PASSWORD_HASHES || secrets.VITE_ALLY_PASSWORD_HASHES }}
          VITE_ALLY_PASSWORD_HASH: ${{ vars.VITE_ALLY_PASSWORD_HASH || secrets.VITE_ALLY_PASSWORD_HASH }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const splitValues = (value = '') =>
            value
              .split(/\r?\n|,|;/)
              .map((entry) => entry.trim())
              .filter(Boolean);

          const hashPassword = (value) =>
            crypto.createHash('sha256').update(value, 'utf8').digest('hex');

          const prepareHashes = (hashes, legacyHash, passwords) => [
            ...splitValues(hashes).map((value) =>
              value.toLowerCase(),
            ),
            ...splitValues(legacyHash).map((value) =>
              value.toLowerCase(),
            ),
            ...splitValues(passwords).map((value) =>
              hashPassword(value),
            ),
          ];

          const emergencyHashes = prepareHashes(
            process.env.VITE_EMERGENCY_POPUP_PASSWORD_HASHES,
            process.env.VITE_EMERGENCY_POPUP_PASSWORD_HASH,
            process.env.EMERGENCY_POPUP_PASSWORDS,
          );
          const allyHashes = prepareHashes(
            process.env.VITE_ALLY_PASSWORD_HASHES,
            process.env.VITE_ALLY_PASSWORD_HASH,
            process.env.ALLY_PASSWORDS,
          );
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `VITE_EMERGENCY_POPUP_PASSWORD_HASHES=${[...new Set(emergencyHashes)].join(',')}\n` +
            `VITE_ALLY_PASSWORD_HASHES=${[...new Set(allyHashes)].join(',')}\n`,
          );
          NODE

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PRESENCE_DEVICE_ID: ${{ vars.VITE_SUPABASE_PRESENCE_DEVICE_ID || secrets.VITE_SUPABASE_PRESENCE_DEVICE_ID }}
          VITE_SUPABASE_PRESENCE_DEVICE_NAME: ${{ vars.VITE_SUPABASE_PRESENCE_DEVICE_NAME || secrets.VITE_SUPABASE_PRESENCE_DEVICE_NAME }}
          VITE_SHARED_TASKS_OWNER_ACCOUNT_ID: ${{ vars.VITE_SHARED_TASKS_OWNER_ACCOUNT_ID || secrets.VITE_SHARED_TASKS_OWNER_ACCOUNT_ID }}
          VITE_SHARED_TASKS_VIEWER_ACCOUNT_ID: ${{ vars.VITE_SHARED_TASKS_VIEWER_ACCOUNT_ID || secrets.VITE_SHARED_TASKS_VIEWER_ACCOUNT_ID }}
          VITE_SHARED_TASKS_VIEWER_PASSWORD_HASH: ${{ vars.VITE_SHARED_TASKS_VIEWER_PASSWORD_HASH || secrets.VITE_SHARED_TASKS_VIEWER_PASSWORD_HASH }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
